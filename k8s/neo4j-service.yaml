apiVersion: v1
kind: Service
metadata:
  name: neo4j
spec:
  type: ClusterIP
  selector:
    app: neo4j
  ports:
  - name: http
    port: 7474
    targetPort: 7474
  - name: bolt
    port: 7687
    targetPort: 7687
  # don't create env vars with NEO4J_ prefixes
  # since neo4j will attempt to use them and fail 
  enableServiceLinks: false 
